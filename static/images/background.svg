<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="none">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4e73df" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#4e73df" stop-opacity="0.1"/>
        </linearGradient>
        <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#4e73df" stop-opacity="0.03"/>
            <stop offset="100%" stop-color="#4e73df" stop-opacity="0.08"/>
        </linearGradient>
    </defs>
    
    <!-- Base background -->
    <rect width="100%" height="100%" fill="#f8f9fc"/>
    
    <!-- Top wave pattern -->
    <path d="M0,50 C150,150 350,0 500,100 C650,200 800,80 1000,120 C1200,160 1350,50 1440,80 L1440,0 L0,0 Z"
          fill="url(#grad1)" opacity="0.5"/>
    
    <!-- Bottom wave pattern -->
    <path d="M0,750 C200,650 350,800 500,700 C650,600 800,720 1000,680 C1200,640 1300,750 1440,720 L1440,800 L0,800 Z"
          fill="url(#grad2)" opacity="0.5"/>
    
    <!-- Grid pattern -->
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#4e73df" stroke-width="0.5" opacity="0.03"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#smallGrid)"/>
    
    <!-- Scattered dots -->
    <g fill="#4e73df" opacity="0.05">
        <circle cx="100" cy="100" r="4"/>
        <circle cx="300" cy="200" r="6"/>
        <circle cx="500" cy="150" r="5"/>
        <circle cx="700" cy="300" r="7"/>
        <circle cx="900" cy="250" r="4"/>
        <circle cx="1100" cy="100" r="6"/>
        <circle cx="1300" cy="200" r="5"/>
        <circle cx="200" cy="400" r="7"/>
        <circle cx="400" cy="500" r="4"/>
        <circle cx="600" cy="450" r="6"/>
        <circle cx="800" cy="600" r="5"/>
        <circle cx="1000" cy="550" r="7"/>
        <circle cx="1200" cy="450" r="4"/>
        <circle cx="1350" cy="650" r="6"/>
    </g>
</svg>