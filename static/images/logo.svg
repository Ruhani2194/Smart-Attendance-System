<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- Background circle -->
    <circle cx="50" cy="50" r="45" fill="#4e73df" />
    
    <!-- Camera lens outer ring -->
    <circle cx="50" cy="50" r="32" fill="#3a5cdb" stroke="#ffffff" stroke-width="2" />
    
    <!-- Camera lens inner circle -->
    <circle cx="50" cy="50" r="25" fill="#224abe" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Camera lens reflection -->
    <circle cx="40" cy="40" r="8" fill="#ffffff" opacity="0.3" />
    <circle cx="38" cy="38" r="4" fill="#ffffff" opacity="0.4" />
    
    <!-- Face recognition grid lines -->
    <path d="M50,25 L50,75" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,3" />
    <path d="M25,50 L75,50" stroke="#ffffff" stroke-width="1.5" opacity="0.6" stroke-dasharray="2,3" />
    
    <!-- Face outline -->
    <circle cx="50" cy="50" r="15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />
    
    <!-- Eyes -->
    <circle cx="44" cy="46" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="56" cy="46" r="2" fill="#ffffff" opacity="0.9" />
    
    <!-- Smile -->
    <path d="M43,55 Q50,60 57,55" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
</svg>