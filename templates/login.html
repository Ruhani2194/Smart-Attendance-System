{% extends "layout.html" %}

{% block title %}Login - Smart Attendance System{% endblock %}

{% block styles %}
<style>
    .login-container {
        max-width: 450px;
        margin: 40px auto;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        background-color: white;
    }
    .login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    .login-header img {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
    }
    .login-form .form-control:focus {
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
    }
    .login-btn {
        background-color: #4e73df;
        border-color: #4e73df;
        width: 100%;
        padding: 10px;
        font-weight: bold;
    }
    .login-btn:hover {
        background-color: #2e59d9;
        border-color: #2653d4;
    }
    .app-bg {
        background-color: #f8f9fc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="app-bg">
    <div class="login-container">
        <div class="login-header">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Logo">
            <h2 class="text-primary mb-0">Smart Attendance System</h2>
            <p class="text-muted">Please login to continue</p>
        </div>
        
        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            
            <div class="mb-4">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" name="password" id="password" placeholder="Enter your password" required>
                </div>
            </div>
            
            <div class="mb-4">
                <button type="submit" class="btn btn-primary login-btn">Login <i class="fas fa-sign-in-alt ms-1"></i></button>
            </div>
            
            <div class="text-center">
                <p class="text-muted mb-0"><small>Default login: admin / admin123</small></p>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        document.querySelector('.login-form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                e.preventDefault();
                alert('Please fill in all fields');
            }
        });
    });
</script>
{% endblock %}
